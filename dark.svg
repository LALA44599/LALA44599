      <rect x="489" y="71" width="618" height="466" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".22"/>
      <rect x="508" y="91" width="580" height="54" rx="16" fill="#020617" fill-opacity=".52" stroke="rgba(255,255,255,.08)"/>
      <circle cx="535" cy="118" r="6" fill="#EF4444"/><circle cx="557" cy="118" r="6" fill="#F59E0B"/><circle cx="579" cy="118" r="6" fill="#10B981"/>
      <text x="620" y="123" fill="#94A3B8" font-family="'SFMono-Regular','Cascadia Code','Consolas',monospace" font-size="13">profile/readme.svg</text>
