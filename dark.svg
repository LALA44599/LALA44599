    <g clip-path="url(#termClip)" font-family="'SFMono-Regular','Cascadia Code','Consolas',monospace">
      <text x="526" y="187" fill="#F8FAFC" font-size="30" font-weight="800">Hi, I'm LALA44599</text>
      <rect x="526" y="203" width="0" height="36" fill="#0F172A"><animate attributeName="width" values="0;410;410;0" keyTimes="0;.28;.82;1" dur="12s" repeatCount="indefinite"/></rect>
      <text x="526" y="232" fill="url(#accent)" font-size="25" font-weight="700">Full Stack Developer</text>
      <text x="526" y="232" fill="url(#accent)" font-size="25" font-weight="700" opacity="0">Frontend Engineer<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.28;.32;.55;.58" dur="12s" repeatCount="indefinite"/></text>
      <text x="526" y="232" fill="url(#accent)" font-size="25" font-weight="700" opacity="0">AI Enthusiast<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.62;.86;.9" dur="12s" repeatCount="indefinite"/></text>
      <rect x="528" y="206" width="3" height="30" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/><animate attributeName="x" values="528;790;528" dur="12s" repeatCount="indefinite"/></rect>

      <g font-size="15">
