        <text x="526" y="312" fill="#94A3B8" opacity="0">education <tspan fill="#F8FAFC">Self-taught builder</tspan><animate attributeName="opacity" values="0;1" begin=".8s" dur=".8s" fill="freeze"/></text>
        <text x="526" y="342" fill="#94A3B8" opacity="0">focus <tspan fill="#F8FAFC">Web apps, UI, automation, AI</tspan><animate attributeName="opacity" values="0;1" begin="1.3s" dur=".8s" fill="freeze"/></text>
        <text x="526" y="372" fill="#94A3B8" opacity="0">portfolio <tspan fill="#F8FAFC">github.com/LALA44599</tspan><animate attributeName="opacity" values="0;1" begin="1.8s" dur=".8s" fill="freeze"/></text>
      </g>

      <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
        <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur=".8s" fill="freeze"/>
          <rect x="526" y="405" width="70" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="546" y="425" fill="#F8FAFC">React</text>
          <rect x="606" y="405" width="78" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="624" y="425" fill="#F8FAFC">Next.js</text>
          <rect x="694" y="405" width="100" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="713" y="425" fill="#F8FAFC">TypeScript</text>
          <rect x="804" y="405" width="78" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="823" y="425" fill="#F8FAFC">Node.js</text>
          <rect x="892" y="405" width="76" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="913" y="425" fill="#F8FAFC">Python</text>
          <rect x="526" y="447" width="76" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="546" y="467" fill="#F8FAFC">Docker</text>
          <rect x="612" y="447" width="50" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="630" y="467" fill="#F8FAFC">Git</text>
          <rect x="672" y="447" width="70" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="691" y="467" fill="#F8FAFC">Figma</text>
          <rect x="752" y="447" width="82" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="770" y="467" fill="#F8FAFC">Postgres</text>
          <rect x="844" y="447" width="56" height="30" rx="15" fill="#111827" stroke="url(#accent)"/><text x="865" y="467" fill="#F8FAFC">AWS</text>
        </g>
      </g>
      <g transform="translate(526 506)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="3.2s" dur=".8s" fill="freeze"/>
        <text x="0" y="0" fill="#94A3B8" font-size="14">GitHub</text>
        <text x="88" y="0" fill="#94A3B8" font-size="14">LinkedIn</text>
        <text x="194" y="0" fill="#94A3B8" font-size="14">Portfolio</text>
        <line x1="0" y1="16" x2="270" y2="16" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"><animate attributeName="x2" values="0;270" begin="3.3s" dur="1s" fill="freeze"/></line>
      </g>
