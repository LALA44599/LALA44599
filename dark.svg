        <tspan x="0" y="45" opacity="0">      .'  _    _  '.<animate attributeName="opacity" values="0;1;1" begin=".45s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="68" opacity="0">     /   (_)  (_)   \<animate attributeName="opacity" values="0;1;1" begin=".7s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="91" opacity="0">    |  .--. __ .--.  |<animate attributeName="opacity" values="0;1;1" begin=".95s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="114" opacity="0">    | /   /____\   \ |<animate attributeName="opacity" values="0;1;1" begin="1.2s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="137" opacity="0">     \    .____.    /<animate attributeName="opacity" values="0;1;1" begin="1.45s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="160" opacity="0">      '.   `--'   .'<animate attributeName="opacity" values="0;1;1" begin="1.7s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="183" opacity="0">        '-.____.-'<animate attributeName="opacity" values="0;1;1" begin="1.95s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="229" opacity="0">   &lt; LALA44599 /&gt;<animate attributeName="opacity" values="0;1;1" begin="2.25s" dur="8s" repeatCount="indefinite"/></tspan>
        <tspan x="0" y="252" opacity="0">   build fast. ship clean.<animate attributeName="opacity" values="0;1;1" begin="2.55s" dur="8s" repeatCount="indefinite"/></tspan>
      </text>
      <rect x="-20" y="-6" width="400" height="300" fill="#22D3EE" opacity=".08">
        <animate attributeName="y" values="-6;260;-6" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="266" width="12" height="20" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

