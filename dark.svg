    <rect x="24" y="24" width="1132" height="562" rx="30" fill="none" stroke="url(#accent)" stroke-opacity=".7" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values=".25;.85;.25" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="42" width="1092" height="118" fill="white" opacity=".08" mask="url(#reflection)"/>

