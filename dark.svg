<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1180 610" role="img" aria-label="LALA44599 GitHub profile hero banner">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="48%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0" y1="0" x2="460" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 230 260;18 230 260;0 230 260" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="84%" r="58%">
      <stop offset="0%" stop-color="#10B981" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 .35 0 0 0 0 .85 0 0 0 0 1 0 0 0 .7 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1180" height="610" rx="34"/></clipPath>
    <clipPath id="termClip"><rect x="488" y="70" width="620" height="468" rx="24"/></clipPath>
    <mask id="reflection"><rect width="1180" height="610" fill="black"/><path d="M56 45 H1124 V205 C790 135 405 245 56 140 Z" fill="white" opacity=".5"/></mask>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1180" height="610" fill="#030712"/>
    <rect width="1180" height="610" fill="url(#glowA)"/>
    <rect width="1180" height="610" fill="url(#glowB)">
      <animate attributeName="opacity" values=".65;.92;.65" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1180" height="610" filter="url(#noise)" opacity=".42"/>
    <g opacity=".6">
      <circle cx="122" cy="118" r="2.2" fill="#22D3EE"><animate attributeName="cy" values="118;98;118" dur="5.8s" repeatCount="indefinite"/></circle>
      <circle cx="288" cy="476" r="1.7" fill="#A78BFA"><animate attributeName="cy" values="476;452;476" dur="6.6s" repeatCount="indefinite"/></circle>
      <circle cx="1014" cy="154" r="2" fill="#34D399"><animate attributeName="cy" values="154;130;154" dur="7.2s" repeatCount="indefinite"/></circle>
      <circle cx="1074" cy="430" r="1.5" fill="#22D3EE"><animate attributeName="cy" values="430;407;430" dur="5.2s" repeatCount="indefinite"/></circle>
