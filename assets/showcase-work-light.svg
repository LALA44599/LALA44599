  <text x="52" y="95" fill="#171B2B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="850">Trois systèmes, une même logique : rendre le travail plus clair.</text>
  <g><rect x="52" y="116" width="1096" height="190" rx="24" fill="#FFFFFF" stroke="#D7DDED"/><rect x="52" y="116" width="9" height="190" rx="4.5" fill="#087EA4"/><text x="94" y="177" fill="#087EA4" font-family="ui-monospace, monospace" font-size="30" font-weight="800">01</text><text x="94" y="210" fill="#58647A" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">AI LEARNING LAB</text><path d="M206 148V274" stroke="#D7DDED"/><text x="248" y="170" fill="#171B2B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="820">Comprendre l'intelligence artificielle</text><text x="248" y="224" fill="#58647A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16"><tspan x="248" dy="0">AI-901 courses, adaptive quizzes, interactive maps and a complete learning</tspan><tspan x="248" dy="24">website.</tspan></text><text x="248" y="286" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">26 modules</text><text x="570" y="286" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">869 questions</text><text x="248" y="310" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">990 notions</text><text x="570" y="310" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Python + Vite</text></g><g><rect x="52" y="340" width="1096" height="190" rx="24" fill="#FFFFFF" stroke="#D7DDED"/><rect x="52" y="340" width="9" height="190" rx="4.5" fill="#7048D8"/><text x="94" y="401" fill="#7048D8" font-family="ui-monospace, monospace" font-size="30" font-weight="800">02</text><text x="94" y="434" fill="#58647A" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">SLIDE INTELLIGENCE</text><path d="M206 372V498" stroke="#D7DDED"/><text x="248" y="394" fill="#171B2B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="820">Générateur intelligent de diaporamas</text><text x="248" y="448" fill="#58647A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16"><tspan x="248" dy="0">React and Flask application using Gemini to analyze, improve and quality-check</tspan><tspan x="248" dy="24">presentations.</tspan></text><text x="248" y="510" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">React</text><text x="570" y="510" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Flask</text><text x="248" y="534" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Gemini API</text><text x="570" y="534" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Quality critic</text></g><g><rect x="52" y="564" width="1096" height="190" rx="24" fill="#FFFFFF" stroke="#D7DDED"/><rect x="52" y="564" width="9" height="190" rx="4.5" fill="#087A67"/><text x="94" y="625" fill="#087A67" font-family="ui-monospace, monospace" font-size="30" font-weight="800">03</text><text x="94" y="658" fill="#58647A" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">B2B DIGITAL EXPERIENCE</text><path d="M206 596V722" stroke="#D7DDED"/><text x="248" y="618" fill="#171B2B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="820">Écosystème digital Secodi</text><text x="248" y="672" fill="#58647A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16"><tspan x="248" dy="0">UX/UI, B2B customer journeys, product content, analytics and CRM exploration.</tspan></text><text x="248" y="734" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Private case study</text><text x="570" y="734" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">UX/UI</text><text x="248" y="758" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Analytics</text><text x="570" y="758" fill="#58647A" font-family="ui-monospace, monospace" font-size="12">Product data</text></g>
  <text x="58" y="774" fill="#58647A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Private case study / Étude de cas privée : aucune donnée interne ni code propriétaire n’est publié.</text>
