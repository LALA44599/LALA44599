amily="ui-sans-serif, system-ui, sans-serif" font-size="16"><tspan x="248" dy="0">React and Flask application using Gemini to analyze, improve and quality-check</tspan><tspan x="248" dy="24">presentations.</tspan></text><text x="248" y="510" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">React</text><text x="570" y="510" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">Flask</text><text x="248" y="534" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">Gemini API</text><text x="570" y="534" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">Quality critic</text></g><g><rect x="52" y="564" width="1096" height="190" rx="24" fill="#111522" stroke="#2B3450"/><rect x="52" y="564" width="9" height="190" rx="4.5" fill="#72F3C8"/><text x="94" y="625" fill="#72F3C8" font-family="ui-monospace, monospace" font-size="30" font-weight="800">03</text><text x="94" y="658" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">B2B DIGITAL EXPERIENCE</text><path d="M206 596V722" stroke="#2B3450"/><text x="248" y="618" fill="#F7F8FF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="820">Écosystème digital Secodi</text><text x="248" y="672" fill="#A9B0C5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16"><tspan x="248" dy="0">UX/UI, B2B customer journeys, product content, analytics and CRM exploration.</tspan></text><text x="248" y="734" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">Private case study</text><text x="570" y="734" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">UX/UI</text><text x="248" y="758" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">Analytics</text><text x="570" y="758" fill="#A9B0C5" font-family="ui-monospace, monospace" font-size="12">Product data</text></g>
